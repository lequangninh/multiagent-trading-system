apiVersion: 1
datasources:
  - name: TimescaleDB
    uid: timescale
    type: grafana-postgresql-datasource
    access: proxy
    url: timescaledb:5432
    user: swarm
    isDefault: true
    editable: false
    jsonData:
      database: swarm
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
      maxOpenConns: 4
    secureJsonData:
      password: $POSTGRES_PASSWORD
