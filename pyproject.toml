[project]
name = "swarm-trader"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp",
    "ccxt",
    "pydantic>=2,<3",
    "asyncpg",
    "redis>=5",
    "pandas",
    "numpy",
    "pyyaml",
    "structlog",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "hypothesis>=6.168.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
